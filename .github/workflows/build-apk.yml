# ===================================================================================
# GENFITY ORDER APP - BUILD APK
# ===================================================================================
#
# Auto-build signed APK setiap push ke main (disimpan sebagai Actions artifact,
# retensi 30 hari) + GitHub Release permanen setiap push tag v* (mis. v1.0.1).
#
# Pola meniru job android_apk di genfity-order-main (local Gradle build di
# runner, bukan EAS cloud) supaya konsisten dengan CCD yang sudah ada.
#
# Secrets yang wajib diisi (repo Settings → Secrets and variables → Actions):
#   - ANDROID_KEYSTORE_BASE64    : keystore rilis (base64)
#   - ANDROID_KEYSTORE_PASSWORD  : password keystore
#   - ANDROID_KEY_ALIAS          : alias key (mis. genfity-order)
#   - ANDROID_KEY_PASSWORD       : password key
#   - VPS_HOST / VPS_USER / VPS_SSH_KEY (opsional) : hanya untuk publish ke
#     https://order.genfity.com/downloads/ (job publish-vps). Tanpa ini, APK
#     tetap tersedia via Actions artifact + GitHub Releases, dan kartu unduh
#     di website otomatis pakai link GitHub sampai manifest VPS tersedia.
#
# Variables (opsional, Settings → Secrets and variables → Actions → Variables):
#   - EXPO_PUBLIC_API_BASE_URL   : URL backend (kosong = Local Mode/offline SQLite)
#
# Cara rilis permanen (pastikan version di package.json sudah dinaikkan dulu):
#   git tag v1.0.1 && git push origin v1.0.1
#
# ===================================================================================

name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/debug-*.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Expo prebuild (generate android/)
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Attach release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          # Blok android{} kedua legal di Gradle dan menimpa signing debug
          # bawaan template Expo — tanpa perlu menebak nama properti template.
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Verify signature and prepare download
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/genfity-order.apk
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Genfity-Order-$APP_VERSION.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER" || { echo 'Android apksigner was not found'; exit 1; }
          APK_PATH=dist/genfity-order.apk
          CERT_REPORT=$(mktemp)
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" > "$CERT_REPORT"
          cat "$CERT_REPORT"
          CERT_SHA256=$(sed -nE '/^Signer #[0-9]+ certificate SHA-256 digest:/ { s/^Signer #[0-9]+ certificate SHA-256 digest:[[:space:]]*//; p; q; }' "$CERT_REPORT" | tr '[:lower:]' '[:upper:]')
          if [ -z "$CERT_SHA256" ]; then
            CERT_SHA256=$("$APKSIGNER" verify --print-certs-pem "$APK_PATH" \
              | openssl x509 -outform DER 2>/dev/null \
              | sha256sum \
              | awk '{print toupper($1)}')
          fi
          [[ "$CERT_SHA256" =~ ^[A-F0-9]{64}$ ]] || { echo 'Unable to verify APK signing certificate SHA-256'; exit 1; }
          cd dist
          sha256sum genfity-order.apk > genfity-order.apk.sha256
          printf '{"version":"%s","commit":"%s","signingCertificateSha256":"%s","apkSha256":"%s"}\n' "$APP_VERSION" "${{ github.sha }}" "$CERT_SHA256" "$(cut -d' ' -f1 genfity-order.apk.sha256)" > release.json
          cat release.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: genfity-order-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: genfity-order-apk
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check genfity-order.apk.sha256
          NOTES=$(node -e "const m=require('./release.json');console.log('APK SHA-256: '+m.apkSha256+'\nSigning cert SHA-256: '+m.signingCertificateSha256+'\nCommit: '+m.commit)")
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            Genfity-Order-*.apk genfity-order.apk genfity-order.apk.sha256 release.json \
            --title "${{ github.ref_name }}" \
            --notes "$NOTES"

  publish-vps:
    name: Publish APK to website downloads
    needs: build-apk
    if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - name: Check VPS secrets
        id: gate
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "VPS secrets belum diisi - publish ke website dilewati (APK tetap ada di artifact + Releases)."
          fi

      - name: Download APK artifact
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: genfity-order-apk
          path: dist

      - name: Verify checksum and build website manifest
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check genfity-order.apk.sha256
          APP_VERSION=$(node -p "require('./release.json').version")
          node -p "require('./release.json').signingCertificateSha256" > genfity-order.cert.sha256
          node -e "const m=require('./release.json');console.log(JSON.stringify({version:m.version,commit:m.commit,minimumSupportedVersion:m.version,signingCertificateSha256:m.signingCertificateSha256,apkSha256:m.apkSha256,downloadUrl:'https://order.genfity.com/downloads/Genfity-Order-'+m.version+'.apk'}))" > genfity-order.json
          cp genfity-order.apk "Genfity-Order-$APP_VERSION.apk"
          cat genfity-order.json

      - name: Setup SSH
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ssh-keyscan ke VPS kadang timeout karena koneksi SSH baru di-drop
          # saat traffic CI paralel sedang tinggi (terbukti: repo main pun
          # pernah gagal di step yang sama lalu sukses di run berikutnya).
          # Coba ulang dengan backoff + timeout lebih panjang.
          rm -f ~/.ssh/known_hosts
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 20 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>keyscan.err && [ -s ~/.ssh/known_hosts ]; then
              rm -f keyscan.err
              echo "keyscan OK (percobaan $i)"
              break
            fi
            echo "keyscan percobaan $i gagal:"
            cat keyscan.err || true
            rm -f ~/.ssh/known_hosts
            if [ "$i" -eq 5 ]; then
              echo 'ssh-keyscan gagal 5x - kemungkinan VPS men-drop koneksi SSH baru (cek MaxStartups/fail2ban/sshd di VPS)'
              exit 1
            fi
            sleep $((i * 15))
          done

      - name: Publish to downloads folder
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./dist/release.json').version")
          scp dist/genfity-order.apk "$VPS_USER@$VPS_HOST:/tmp/genfity-order-${{ github.sha }}.apk"
          scp "dist/Genfity-Order-$APP_VERSION.apk" "$VPS_USER@$VPS_HOST:/tmp/genfity-order-${{ github.sha }}-versioned.apk"
          scp dist/genfity-order.apk.sha256 "$VPS_USER@$VPS_HOST:/tmp/genfity-order-${{ github.sha }}.apk.sha256"
          scp dist/genfity-order.json "$VPS_USER@$VPS_HOST:/tmp/genfity-order-${{ github.sha }}.json"
          scp dist/genfity-order.cert.sha256 "$VPS_USER@$VPS_HOST:/tmp/genfity-order-${{ github.sha }}.cert.sha256"
          ssh "$VPS_USER@$VPS_HOST" << ENDSSH
            set -euo pipefail
            install -d -m 0755 /var/www/genfity-order-downloads
            if [ -f /var/www/genfity-order-downloads/genfity-order.signing-certificate.sha256 ]; then
              cmp /var/www/genfity-order-downloads/genfity-order.signing-certificate.sha256 /tmp/genfity-order-${{ github.sha }}.cert.sha256 || { echo 'APK signing certificate changed; refusing release'; exit 1; }
            fi
            install -m 0644 /tmp/genfity-order-${{ github.sha }}.cert.sha256 /var/www/genfity-order-downloads/genfity-order.signing-certificate.sha256
            install -m 0644 /tmp/genfity-order-${{ github.sha }}.apk /var/www/genfity-order-downloads/genfity-order.apk.new
            install -m 0644 "/tmp/genfity-order-${{ github.sha }}-versioned.apk" "/var/www/genfity-order-downloads/Genfity-Order-$APP_VERSION.apk"
            install -m 0644 /tmp/genfity-order-${{ github.sha }}.apk.sha256 /var/www/genfity-order-downloads/genfity-order.apk.sha256.new
            install -m 0644 /tmp/genfity-order-${{ github.sha }}.json /var/www/genfity-order-downloads/genfity-order.json.new
            mv /var/www/genfity-order-downloads/genfity-order.apk.new /var/www/genfity-order-downloads/genfity-order.apk
            mv /var/www/genfity-order-downloads/genfity-order.apk.sha256.new /var/www/genfity-order-downloads/genfity-order.apk.sha256
            mv /var/www/genfity-order-downloads/genfity-order.json.new /var/www/genfity-order-downloads/genfity-order.json
            rm -f /tmp/genfity-order-${{ github.sha }}.*
          ENDSSH
