# ===================================================================================
# GENFITY ORDER APP - TEST (typecheck + tripwire)
# ===================================================================================
# Job CI ringan sisi-APP (PP-012): typecheck + runner tripwire statik.
# SENGAJA file terpisah — JANGAN gabung ke build-apk.yml (workflow bersama
# milik alur rilis APK; perubahan di sini tak boleh menggoyang rilis).
# Tanpa emulator/dev-client: semua tripwire = node murni + baca sumber.
# ===================================================================================

name: Test APP

on:
  push:
    branches: [main, 'handover/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-app:
    name: Typecheck + tripwire
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tripwire tests
        run: npm test
